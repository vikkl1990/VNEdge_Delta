contract_id: htf_structure_break_v2
status: preregistered
research_only: true
can_trade: false
can_promote: false

data:
  symbols: [BTCUSD, ETHUSD]
  source_timeframe: 1m
  decision_timeframe: 1h
  bias_timeframe: 4h
  selection_start: "2025-01-01T00:00:00+00:00"
  selection_end_exclusive: "2026-04-01T00:00:00+00:00"
  embargo_hours: 48
  untouched_start: "2026-04-03T00:00:00+00:00"
  untouched_end_exclusive: "2026-08-06T00:00:00+00:00"
  require_closed_candles: true

bias:
  ema_fast_4h: 20
  ema_slow_4h: 50

structure:
  swing_left_bars: 5
  swing_right_bars: 5
  minimum_swing_bps: 0.0
  event_type: bos
  require_event_direction_matches_4h: true
  target_level_sources: [1h, 4h]
  target_rule: nearest_confirmed_same_kind_swing_beyond_decision_close
  stop_rule: broken_swing_plus_0_10_atr
  atr_window_1h: 14
  atr_stop_buffer_multiple: 0.10

exit:
  minimum_target_cost_multiple: 5.0
  expected_hold_seconds: 21600
  time_stop_seconds: 43200

costs:
  prefer_maker: false
  scalper_opted_in: false
  deto_enabled: false
  maker_fee_bps_pre_tax: 2.0
  taker_fee_bps_pre_tax: 5.0
  gst_rate: 0.18
  slippage_bps_per_leg: 1.5
  baseline_round_trip_bps: 14.8
  funding_required_for_all_in_result: true
  funding_settlement_interval_seconds: 28800

latency:
  max_feed_lag_ms: 5000
  gap_fail_closed: true

validation:
  minimum_selection_trades: 80
  minimum_selection_trades_per_half: 25
  minimum_selection_trades_per_market: 25
  minimum_selection_average_net_bps: 3.0
  minimum_selection_profit_factor: 1.20
  minimum_trades_per_day: 0.02
  maximum_trades_per_day_per_market: 2.0
  require_gross_expectancy_above_cost: true
  require_positive_selection_halves: true
  require_positive_selection_markets: true
  open_untouched_only_after_selection_pass: true

policy:
  decision: completed causal 1h close only
  entry: next 1h interval open, represented by the next closed 1m bar open
  shared_close_order: apply 4h update before 1h decision
  same_bar_stop_and_target: stop_first
  duplicate_policy: one intent per symbol, side and 1h decision close
  active_observation_policy: one pending or open observation per market
  geometry_policy: revalidate absolute stop and target at actual entry open
  missing_data_policy: reset state and discard pending/open observations
  funding_policy: use only 8h settlements crossed after entry and through exit
  l2_role: unavailable_and_not_used
  meta_model_role: unavailable_and_not_used
  parameter_search: forbidden_on_this_selection_window
  untouched_policy: do not load or score unless every selection gate passes
