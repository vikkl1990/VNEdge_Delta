study_id: btc_eth_transfer_entropy_v1
status: preregistered
research_only: true
can_trade: false
can_promote: false

data:
  leader_symbol: BTCUSD
  follower_symbol: ETHUSD
  start: "2025-01-01T00:00:00+00:00"
  end: "2026-04-01T23:53:00+00:00"
  sealed_tail_start: "2026-04-02T00:23:00+00:00"
  source_timeframe: 1m
  require_exact_timestamp_match: true
  require_complete_5m_buckets: true
  sealed_tail_access_forbidden: true

encoding:
  method: within_window_quantile_tertiles
  states: 3
  target: log_return
  history_lengths: [1, 2, 3]
  forecast_horizon_bars: 1

rolling:
  timeframes_minutes: [1, 5]
  directions: [btc_to_eth, eth_to_btc]
  window_days: 90
  step_days: 30
  minimum_observations: 10000

surrogates:
  method: segmentwise_circular_shift
  count: 99
  random_seed: 20260807
  minimum_shift_bars: 20
  preserve_source_autocorrelation: true
  preserve_gap_segments: true

statistics:
  units: bits
  estimator: discrete_plugin_with_surrogate_bias_correction
  alpha: 0.05
  multiple_test_correction: benjamini_hochberg_per_rolling_window
  full_period_result_role: descriptive_only

advancement:
  minimum_valid_rolling_windows: 8
  minimum_corrected_significant_fraction: 0.60
  minimum_positive_effective_te_fraction: 0.70
  minimum_median_effective_te_bits: 0.0005
  minimum_median_normalized_effective_te: 0.005
  minimum_directionality_ratio: 1.25
  positive_result_authorizes: preregistration_of_a_distinct_v2_only
  scanner_backtest_authorized: false
  old_v1_tail_may_open: false

policy:
  causal_claim: directed_predictive_information_not_structural_causation
  scanner_threshold_selection: forbidden
  volatility_conditioning: deferred_to_separate_preregistration
  transaction_cost_claim: none
  result_scope: selection_window_only
